name: Create Release

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: create-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      startsWith(github.event.pull_request.title, '🔖 Release version ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Check out merged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Extract release metadata
        id: metadata
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          tag="v${version}"
          notes_path="${RUNNER_TEMP}/release-${version}.md"
          uv run python scripts/prepare_release.py extract \
            --version "$version" \
            --output "$notes_path"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes-path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          NOTES_PATH: ${{ steps.metadata.outputs.notes-path }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; no new publication was started."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "$MERGE_COMMIT" \
            --title "$RELEASE_TAG" \
            --notes-file "$NOTES_PATH"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch publication workflow
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: gh workflow run publish.yml --ref main --field release_tag="$RELEASE_TAG"

[project]
name = "qualtrics"
version = "0.3.0"
description = "A typed Qualtrics SDK and offline survey data toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=17"]

[dependency-groups]
dev = [
    "poethepoet>=0.37,<1",
    "pre-commit>=4.3,<5",
    "ruff>=0.12,<1",
    "ty>=0.0.1a19,<1",
]
test = [
    "pytest>=8,<10",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14,<4",
    "pytest-sugar>=1.0,<2",
]

[project.scripts]
qualtrics = "qualtrics.cli.app:app"

[tool.hatch.build.targets.sdist]
include = ["src/qualtrics"]

[tool.hatch.build.targets.wheel]
include = ["src/qualtrics"]

[tool.hatch.build.targets.wheel.sources]
"src/qualtrics" = "qualtrics"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
addopts = '''
    --color=yes
    --doctest-modules
    --strict-config
    --strict-markers
    --verbosity=2
    --junitxml=reports/junit.xml
    --cov-report=xml:reports/coverage.xml
    --cov-report=term
    --cov=src'''
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::SyntaxWarning"
]
testpaths = ["src", "tests"]
xfail_strict = true
log_file_level = "INFO"
pythonpath = "src"

[tool.coverage.report]
skip_empty = true
show_missing = true
ignore_errors = true
exclude_lines = [
    "@abstractmethod",
    "@abc.abstractmethod",
    "if self.debug:",
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
exclude_also= [
  "class \\w+\\(Protocol\\):"
]
fail_under=75

[tool.coverage.xml]
output = "cover/coverage.xml"

[tool.coverage.run]
branch = true
disable_warnings = ["ignore::UserWarning"]
source = ["src", "tests"]
omit= [
  "*/__init__.py",
  "*/__version__.py",
  "tests/fixtures/*",
  "**/fixtures.py"
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py311"
force-exclude = true  # https://docs.astral.sh/ruff/settings/#force-exclude
preview = true  # https://docs.astral.sh/ruff/preview/

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["B903"]

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
type = "ty check"
test = "pytest"
build = "uv build"
pre-commit = "pre-commit run --all-files"
check = ["lint", "format-check", "type", "test"]

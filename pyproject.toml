[project]
name = "qualtrics-toolkit"
version = "0.3.0"
description = "A typed Qualtrics SDK and offline survey data toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=17"]

[dependency-groups]
dev = [
    "poethepoet>=0.37,<1",
    "ruff>=0.12,<1",
    "ty>=0.0.1a19,<1",
]
test = [
    "pytest>=8,<10",
    "pytest-mock>=3.14,<4",
    "pytest-sugar>=1.0,<2",
]

[project.scripts]
qualtrics-toolkit = "qualtrics_toolkit.cli.app:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qualtrics_toolkit = ["py.typed", "reporting/templates/*.jinja", "reporting/static/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
type = "ty check"
test = "pytest"
build = "uv build"
check = ["lint", "format-check", "type", "test"]

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">From survey export to useful results</title>
  <desc id="desc">Combine a response CSV or ZIP with an optional matching QSF definition. Parse them into ten organized tables, then create an HTML report or six Power BI tables.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#176b68" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="420" rx="20" fill="#f4f8f7"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#17333b">
    <text x="42" y="54" font-size="17" font-weight="700" letter-spacing="1.5">YOUR SURVEY, STEP BY STEP</text>
    <rect x="42" y="100" width="280" height="108" rx="14" fill="#fff" stroke="#bdd9d5"/>
    <text x="66" y="142" font-size="23" font-weight="700">Response file</text>
    <text x="66" y="177" font-size="19">CSV or ZIP</text>
    <rect x="42" y="232" width="280" height="108" rx="14" fill="#fff" stroke="#bdd9d5"/>
    <text x="66" y="274" font-size="23" font-weight="700">Survey definition</text>
    <text x="66" y="309" font-size="19">QSF, recommended</text>
    <path d="M337 154 H374 V286 H337" fill="none" stroke="#176b68" stroke-width="3"/>
    <path d="M374 220 H423" fill="none" stroke="#176b68" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="443" y="145" width="300" height="150" rx="14" fill="#176b68"/>
    <text x="469" y="190" font-size="15" fill="#c9eee5" font-weight="700" letter-spacing="1.2">PARSE YOUR EXPORT</text>
    <text x="469" y="229" font-size="27" fill="#fff" font-weight="700">10 organized tables</text>
    <text x="469" y="267" font-size="18" fill="#e3f4ef">Questions, responses, answers…</text>
    <path d="M756 220 H798" fill="none" stroke="#176b68" stroke-width="3"/>
    <path d="M798 220 V154 H848" fill="none" stroke="#176b68" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M798 220 V286 H848" fill="none" stroke="#176b68" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="872" y="100" width="286" height="108" rx="14" fill="#fff" stroke="#bdd9d5"/>
    <text x="896" y="142" font-size="23" font-weight="700">HTML report</text>
    <text x="896" y="177" font-size="19">Explore in your browser</text>
    <rect x="872" y="232" width="286" height="108" rx="14" fill="#fff" stroke="#bdd9d5"/>
    <text x="896" y="274" font-size="23" font-weight="700">Power BI tables</text>
    <text x="896" y="309" font-size="18">6 tables for your dashboard</text>
    <text x="42" y="387" font-size="17" fill="#49656d">Start with files you already have. No API connection is needed for these steps.</text>
  </g>
</svg>
